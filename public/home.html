<!doctype html>
<html lang="pt-BR" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural</title>
<style>
  @font-face {
    font-family: "DM Sans Variable"; font-style: normal; font-display: swap;
    font-weight: 100 1000;
    src: url("/assets/dm-sans-latin-wght-normal.woff2") format("woff2-variations");
  }

  :root {
    --color-brand-50: #ecfff7; --color-brand-400: #2ce293; --color-brand-500: #00d479;
    --color-brand-700: #009457; --color-brand-950: #123320;
    --color-neutral-0: #ffffff; --color-neutral-50: #f7f9f8; --color-neutral-100: #f0f3f1;
    --color-neutral-200: #e6eae7; --color-neutral-300: #d5dcd7; --color-neutral-500: #95a399;
    --color-neutral-650: #474f55; --color-neutral-700: #3a4146; --color-neutral-750: #2f353a;
    --color-neutral-800: #262b2f; --color-neutral-850: #1f2427; --color-neutral-925: #15181b;
    --color-neutral-950: #172019;
    --color-success-300: #9de5ba; --color-success-500: #35b76f; --color-success-600: #2a9a5c;
    --color-success-700: #1f7a48;
    --color-warning-300: #ffd986; --color-warning-500: #f2b84b; --color-warning-700: #8a5b00;
    --color-danger-300: #ffb4b4; --color-danger-500: #e05252; --color-danger-600: #c93f3f;
    --color-info-200: #a9c9ff; --color-info-500: #3b82f6; --color-info-800: #1a478f;
  }
  [data-color-mode="light"], :root {
    --bg-app: var(--color-neutral-50); --bg-surface: var(--color-neutral-0);
    --bg-surface-2: var(--color-neutral-100); --bg-surface-3: var(--color-neutral-200);
    --bg-brand: var(--color-brand-500); --bg-brand-hover: var(--color-brand-700);
    --bg-brand-subtle: var(--color-brand-50);
    --bg-success: #eaf8f0; --bg-warning: #fff7e5; --bg-danger: #fdeeee; --bg-info: #ebf3ff;
    --border-subtle: var(--color-neutral-100); --border-default: var(--color-neutral-200);
    --border-strong: var(--color-neutral-300);
    --focus-ring: color-mix(in srgb, var(--color-brand-500) 32%, transparent);
    --text-primary: var(--color-neutral-950); --text-secondary: #4e5c52;
    --text-tertiary: #68756c; --text-muted: #758079; --text-on-brand: var(--color-brand-950);
    --text-success: var(--color-success-700); --text-warning: var(--color-warning-700);
    --text-danger: var(--color-danger-600); --text-info: var(--color-info-800);
    --marca-aberto: var(--color-danger-500); --marca-interagido: var(--color-info-500);
    --marca-feito: var(--color-success-600);
    --shadow-card: 0 1px 2px rgba(23,32,25,.04), 0 1px 3px rgba(23,32,25,.03);
  }
  [data-color-mode="dark"] {
    --bg-app: var(--color-neutral-925); --bg-surface: var(--color-neutral-850);
    --bg-surface-2: var(--color-neutral-800); --bg-surface-3: var(--color-neutral-750);
    --bg-brand-subtle: color-mix(in srgb, var(--color-brand-500) 16%, transparent);
    --bg-success: color-mix(in srgb, var(--color-success-500) 18%, transparent);
    --bg-warning: color-mix(in srgb, var(--color-warning-500) 18%, transparent);
    --bg-danger: color-mix(in srgb, var(--color-danger-500) 18%, transparent);
    --bg-info: color-mix(in srgb, var(--color-info-500) 20%, transparent);
    --border-subtle: var(--color-neutral-750); --border-default: var(--color-neutral-700);
    --border-strong: var(--color-neutral-650);
    --focus-ring: color-mix(in srgb, var(--color-brand-500) 45%, transparent);
    --text-primary: #f4f7f5; --text-secondary: #c2cbc5; --text-tertiary: #a4b2a9;
    --text-muted: var(--color-neutral-500);
    --text-success: var(--color-success-300); --text-warning: var(--color-warning-300);
    --text-danger: var(--color-danger-300); --text-info: var(--color-info-200);
    --marca-aberto: var(--color-danger-500); --marca-interagido: var(--color-info-500);
    --marca-feito: var(--color-success-500);
    --shadow-card: 0 0 rgba(0,0,0,0);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0; background: var(--bg-app); color: var(--text-primary);
    font-family: "DM Sans Variable", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .pagina { max-width: 860px; margin: 0 auto; padding: 44px 24px 64px; }

  .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .ponto-marca {
    width: 11px; height: 11px; border-radius: 999px; background: var(--bg-brand);
    box-shadow: 0 0 0 4px var(--bg-brand-subtle);
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--text-tertiary); font-size: 13.5px; margin: 0 0 28px; }
  .espaco { flex: 1; }

  button {
    font: inherit; font-weight: 500; cursor: pointer; border-radius: 8px;
    padding: 7px 14px; border: 1px solid var(--border-default);
    background: var(--bg-surface); color: var(--text-secondary);
    transition: background-color .12s, border-color .12s, color .12s;
  }
  button:hover:not(:disabled) { background: var(--bg-surface-2); color: var(--text-primary); }
  button.primario {
    background: var(--bg-brand); border-color: var(--bg-brand);
    color: var(--text-on-brand); font-weight: 600;
  }
  button.primario:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); color: #fff; }
  button.icone { padding: 7px 10px; }
  button.perigo:hover { background: var(--bg-danger); color: var(--text-danger); border-color: var(--text-danger); }

  .lista { display: flex; flex-direction: column; gap: 10px; }

  .cartao {
    display: flex; align-items: center; gap: 16px;
    background: var(--bg-surface); border: 1px solid var(--border-default);
    border-radius: 12px; padding: 15px 18px; box-shadow: var(--shadow-card);
    text-decoration: none; color: inherit;
    transition: border-color .12s;
  }
  .cartao:hover { border-color: var(--border-strong); }

  .info { min-width: 0; flex: 1; }
  .nome { font-weight: 600; font-size: 14.5px; }
  .meta { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }

  .numeros { display: flex; gap: 7px; flex: none; }
  .pilula {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border-default); background: var(--bg-surface);
    border-radius: 999px; padding: 4px 11px 4px 8px;
    font-size: 12.5px; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .pilula .ponto { width: 7px; height: 7px; border-radius: 999px; flex: none; }

  .badge {
    display: inline-flex; align-items: center; border-radius: 999px;
    padding: 2px 8px; font-size: 10.5px; font-weight: 600;
  }
  .badge.tipo { background: var(--bg-surface-3); color: var(--text-secondary); }
  .badge.alerta { background: var(--bg-warning); color: var(--text-warning); }

  .acoes { display: flex; gap: 6px; flex: none; }

  .vazio {
    border: 1px dashed var(--border-strong); border-radius: 12px;
    padding: 40px 24px; text-align: center; color: var(--text-muted);
  }
  .erro {
    background: var(--bg-danger); color: var(--text-danger);
    border-radius: 9px; padding: 11px 14px; font-size: 13px; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="pagina">

  <div class="topo">
    <span class="ponto-marca"></span>
    <h1>Mural</h1>
    <span class="espaco"></span>
    <button id="tema" class="icone" title="Alternar tema">◐</button>
    <button class="primario" id="novo">Novo mural</button>
  </div>
  <p class="sub">Seus quadros. Cada um acompanha uma conversa do Teams.</p>

  <p class="erro" id="erro" hidden></p>
  <div class="lista" id="lista"></div>

</div>

<script>
const $ = (id) => document.getElementById(id);

function aplicarTema(m) {
  document.documentElement.setAttribute('data-color-mode', m);
  localStorage.setItem('mural:tema', m);
}
aplicarTema(localStorage.getItem('mural:tema') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('tema').addEventListener('click', () => {
  aplicarTema(document.documentElement.getAttribute('data-color-mode') === 'dark' ? 'light' : 'dark');
});

$('novo').addEventListener('click', () => { location.href = '/onboarding'; });

function rotuloDoTipo(m) {
  if (m.tipo === 'canal') return 'canal';
  return { oneOnOne: 'conversa', meeting: 'reunião', group: 'grupo' }[m.subtipo] || 'chat';
}

// O rotulo da 1a coluna muda com o tipo: "ninguem pegou" pressupoe um time
// dividindo trabalho, o que nao existe numa conversa de duas pessoas.
function rotuloAberto(m) {
  return (m.tipo === 'chat' && m.subtipo === 'oneOnOne') ? 'sem reação' : 'ninguém pegou';
}

function quando(iso) {
  if (!iso) return 'nunca atualizado';
  const d = new Date(iso);
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return d.toLocaleDateString('pt-BR');
}

function pilula(cor, valor, titulo) {
  const s = document.createElement('span');
  s.className = 'pilula';
  s.title = titulo;
  const p = document.createElement('span');
  p.className = 'ponto';
  p.style.background = cor;
  s.appendChild(p);
  s.appendChild(document.createTextNode(String(valor)));
  return s;
}

function badge(classe, texto) {
  const s = document.createElement('span');
  s.className = 'badge ' + classe;
  s.textContent = texto;
  return s;
}

async function carregar() {
  let d;
  try {
    d = await (await fetch('/api/murais')).json();
  } catch (e) {
    $('erro').hidden = false;
    $('erro').textContent = 'Não consegui carregar: ' + e.message;
    return;
  }

  const lista = $('lista');
  lista.replaceChildren();

  if (!d.murais.length) {
    const v = document.createElement('div');
    v.className = 'vazio';
    v.textContent = 'Nenhum mural ainda. Crie o primeiro em "Novo mural".';
    lista.appendChild(v);
    return;
  }

  for (const m of d.murais) {
    const cartao = document.createElement('a');
    cartao.className = 'cartao';
    cartao.href = '/m/' + m.id;

    const info = document.createElement('div');
    info.className = 'info';

    const nome = document.createElement('div');
    nome.className = 'nome';
    nome.textContent = m.nome;
    info.appendChild(nome);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.append(badge('tipo', rotuloDoTipo(m)), ' · ', quando(m.ultimoSync));
    if (m.foraDeAlcance > 0) {
      meta.append(' · ');
      meta.appendChild(badge('alerta', m.foraDeAlcance + ' fora de alcance'));
    }
    info.appendChild(meta);
    cartao.appendChild(info);

    const numeros = document.createElement('div');
    numeros.className = 'numeros';
    numeros.append(
      pilula('var(--marca-aberto)', m.totais.aberto, rotuloAberto(m)),
      pilula('var(--marca-interagido)', m.totais.interagido, 'interagido'),
      pilula('var(--marca-feito)', m.totais.feito, 'concluído'),
    );
    cartao.appendChild(numeros);

    const acoes = document.createElement('div');
    acoes.className = 'acoes';
    const apagar = document.createElement('button');
    apagar.className = 'icone perigo';
    apagar.textContent = '✕';
    apagar.title = 'Remover este mural';
    apagar.addEventListener('click', async (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (!confirm(
        `Remover "${m.nome}"?\n\n` +
        'O histórico acumulado deste mural é apagado. A conversa no Teams não é tocada.'
      )) return;
      try {
        const r = await (await fetch('/api/murais?id=' + m.id, { method: 'DELETE' })).json();
        if (!r.ok) throw new Error(r.erro);
        carregar();
      } catch (e) {
        $('erro').hidden = false;
        $('erro').textContent = e.message;
      }
    });
    acoes.appendChild(apagar);
    cartao.appendChild(acoes);

    lista.appendChild(cartao);
  }
}

carregar();
</script>
</body>
</html>
