<!doctype html>
<html lang="pt-BR" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural</title>
<style>
  /* DM Sans self-hosted (SIL Open Font License), servida pelo proprio server.js —
     sem CDN, funciona offline. */
  @font-face {
    font-family: "DM Sans Variable";
    font-style: normal;
    font-display: swap;
    font-weight: 100 1000;
    src: url("/assets/dm-sans-latin-wght-normal.woff2") format("woff2-variations");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
      U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "DM Sans Variable";
    font-style: normal;
    font-display: swap;
    font-weight: 100 1000;
    src: url("/assets/dm-sans-latin-ext-wght-normal.woff2") format("woff2-variations");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
      U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
      U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /* ---- Primitives — export do Figma Tokens, portado de apps/status ---- */
  :root {
    --color-brand-50: #ecfff7;
    --color-brand-400: #2ce293;
    --color-brand-500: #00d479;
    --color-brand-700: #009457;
    --color-brand-800: #087447;
    --color-brand-950: #123320;

    --color-neutral-0: #ffffff;
    --color-neutral-50: #f7f9f8;
    --color-neutral-100: #f0f3f1;
    --color-neutral-200: #e6eae7;
    --color-neutral-300: #d5dcd7;
    --color-neutral-500: #95a399;
    --color-neutral-600: #6b7b70;
    --color-neutral-650: #474f55;
    --color-neutral-700: #3a4146;
    --color-neutral-750: #2f353a;
    --color-neutral-800: #262b2f;
    --color-neutral-850: #1f2427;
    --color-neutral-925: #15181b;
    --color-neutral-950: #172019;

    --color-success-300: #9de5ba;
    --color-success-500: #35b76f;
    --color-success-600: #2a9a5c;
    --color-success-700: #1f7a48;

    --color-warning-300: #ffd986;
    --color-warning-500: #f2b84b;
    --color-warning-700: #8a5b00;

    --color-danger-300: #ffb4b4;
    --color-danger-500: #e05252;
    --color-danger-600: #c93f3f;

    --color-info-200: #a9c9ff;
    --color-info-500: #3b82f6;
    --color-info-800: #1a478f;
  }

  /* ---- Semantic — light ---- */
  [data-color-mode="light"], :root {
    --bg-app: var(--color-neutral-50);
    --bg-surface: var(--color-neutral-0);
    --bg-surface-2: var(--color-neutral-100);
    --bg-surface-3: var(--color-neutral-200);

    --bg-brand: var(--color-brand-500);
    --bg-brand-hover: var(--color-brand-700);
    --bg-brand-subtle: var(--color-brand-50);

    --bg-success: #eaf8f0;
    --bg-warning: #fff7e5;
    --bg-danger: #fdeeee;
    --bg-info: #ebf3ff;

    --border-subtle: var(--color-neutral-100);
    --border-default: var(--color-neutral-200);
    --border-strong: var(--color-neutral-300);
    --focus-ring: color-mix(in srgb, var(--color-brand-500) 32%, transparent);

    --text-primary: var(--color-neutral-950);
    --text-secondary: #4e5c52;
    --text-tertiary: #68756c;
    --text-muted: #758079;
    --text-brand: var(--color-brand-800);
    --text-on-brand: var(--color-brand-950);
    --text-success: var(--color-success-700);
    --text-warning: var(--color-warning-700);
    --text-danger: var(--color-danger-600);
    --text-info: var(--color-info-800);

    --marca-aberto: var(--color-danger-500);
    --marca-interagido: var(--color-info-500);
    --marca-feito: var(--color-success-600);

    --shadow-card: 0 1px 2px rgba(23,32,25,.04), 0 1px 3px rgba(23,32,25,.03);
    --bg-header-flutuante: color-mix(in srgb, var(--color-neutral-0) 88%, transparent);
  }

  /* ---- Semantic — dark ---- */
  [data-color-mode="dark"] {
    --bg-app: var(--color-neutral-925);
    --bg-surface: var(--color-neutral-850);
    --bg-surface-2: var(--color-neutral-800);
    --bg-surface-3: var(--color-neutral-750);

    --bg-brand-subtle: color-mix(in srgb, var(--color-brand-500) 16%, transparent);
    --bg-success: color-mix(in srgb, var(--color-success-500) 18%, transparent);
    --bg-warning: color-mix(in srgb, var(--color-warning-500) 18%, transparent);
    --bg-danger: color-mix(in srgb, var(--color-danger-500) 18%, transparent);
    --bg-info: color-mix(in srgb, var(--color-info-500) 20%, transparent);

    --border-subtle: var(--color-neutral-750);
    --border-default: var(--color-neutral-700);
    --border-strong: var(--color-neutral-650);
    --focus-ring: color-mix(in srgb, var(--color-brand-500) 45%, transparent);

    --text-primary: #f4f7f5;
    --text-secondary: #c2cbc5;
    --text-tertiary: #a4b2a9;
    --text-muted: var(--color-neutral-500);
    --text-brand: var(--color-brand-400);
    --text-success: var(--color-success-300);
    --text-warning: var(--color-warning-300);
    --text-danger: var(--color-danger-300);
    --text-info: var(--color-info-200);

    --marca-aberto: var(--color-danger-500);
    --marca-interagido: var(--color-info-500);
    --marca-feito: var(--color-success-500);

    /* No dark a hierarquia vem da diferenca de superficie, nao de sombra. */
    --shadow-card: 0 0 rgba(0,0,0,0);
    --bg-header-flutuante: color-mix(in srgb, var(--color-neutral-850) 88%, transparent);
  }

  * { box-sizing: border-box; }

  /* Sem isto, qualquer regra de autor com `display` (como .barra-sync abaixo)
     vence o `[hidden] { display:none }` do navegador e o elemento aparece
     mesmo com o atributo hidden. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: "DM Sans Variable", "DM Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  /* ---- Header flutuante (mesmo padrao do apps/status) ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px;
    background: var(--bg-header-flutuante);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .marca { display: flex; align-items: center; gap: 10px; }
  .ponto-marca {
    width: 10px; height: 10px; border-radius: 999px;
    background: var(--bg-brand);
    box-shadow: 0 0 0 4px var(--bg-brand-subtle);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sync-info { font-size: 12.5px; color: var(--text-tertiary); }
  .espaco { flex: 1; }

  /* ---- Botoes (portado do ui/button) ---- */
  button {
    font: inherit; font-weight: 500; cursor: pointer;
    border-radius: 8px; padding: 7px 14px;
    border: 1px solid var(--border-default);
    background: var(--bg-surface); color: var(--text-secondary);
    transition: background-color .12s, border-color .12s, color .12s;
  }
  button:hover:not(:disabled) { background: var(--bg-surface-2); color: var(--text-primary); }
  button:disabled { opacity: .55; cursor: default; }
  button.primario {
    background: var(--bg-brand); border-color: var(--bg-brand);
    color: var(--text-on-brand); font-weight: 600;
  }
  button.primario:hover:not(:disabled) {
    background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); color: var(--color-neutral-0);
  }
  button.icone { padding: 7px 10px; }

  /* ---- Barra de sync ---- */
  .barra-sync {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 24px;
    background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);
    font-size: 12.5px; color: var(--text-tertiary);
  }
  .trilho {
    flex: 1; max-width: 320px; height: 4px; border-radius: 999px;
    background: var(--bg-surface-3); overflow: hidden;
  }
  .pulso { height: 100%; border-radius: 999px; background: var(--bg-brand); width: 0%; transition: width .4s; }
  .pulso.indefinido { width: 32%; animation: desliza 1.15s ease-in-out infinite; }
  @keyframes desliza { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }

  .erro {
    margin: 0; padding: 11px 24px;
    background: var(--bg-danger); color: var(--text-danger);
    border-bottom: 1px solid var(--border-default); font-size: 13px;
  }

  /* ---- Colunas ---- */
  main {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    padding: 20px 24px; align-items: start;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  .coluna {
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
  }
  .coluna > header {
    position: static; background: none; backdrop-filter: none;
    padding: 12px 14px 10px; border: 0; gap: 9px;
  }
  /* Selo no vocabulario do design system: superficie propria, ponto colorido
     (forma alem da cor) e rotulo em texto. */
  .selo {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border-default); background: var(--bg-surface);
    border-radius: 999px; padding: 5px 12px 5px 9px;
    font-size: 12.5px; font-weight: 500; color: var(--text-primary); line-height: 1;
  }
  .selo .ponto { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .contagem { margin-left: auto; font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .lista { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  /* ---- Card ---- */
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 10px; padding: 11px 13px;
    box-shadow: var(--shadow-card);
    transition: border-color .12s, transform .12s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card:active { transform: translateY(1px); }
  .card .texto { font-size: 13.5px; color: var(--text-primary); }
  .card .rodape {
    margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-muted);
  }
  .card .autor { font-variant-numeric: tabular-nums; }

  /* ---- Badges (portado do ui/badge: rounded-full, semibold, 10px) ---- */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 7px;
    font-size: 10px; font-weight: 600; line-height: 1.5; letter-spacing: .01em;
  }
  .badge.danger { background: var(--bg-danger); color: var(--text-danger); }
  .badge.info { background: var(--bg-info); color: var(--text-info); }
  .badge.warning { background: var(--bg-warning); color: var(--text-warning); }
  .badge.neutral { background: var(--bg-surface-3); color: var(--text-secondary); }
  .badge.reacao { background: var(--bg-surface-3); font-size: 11px; padding: 1px 7px; }

  .abrir-web {
    margin-left: auto; font-size: 11px; color: var(--text-muted);
    border: 1px solid var(--border-default); border-radius: 999px; padding: 1px 8px;
    opacity: 0; transition: opacity .12s;
  }
  .card:hover .abrir-web { opacity: 1; }
  .abrir-web:hover { color: var(--text-primary); border-color: var(--border-strong); }

  .vazio {
    padding: 20px 12px; text-align: center;
    color: var(--text-muted); font-size: 12.5px;
  }

  /* Card fora de alcance: saiu das ~20 mensagens que a API devolve, entao o
     Teams nao conta mais nada sobre ele. Borda tracejada para diferenciar de um
     card vivo, e os botoes de mover a mao aparecem so aqui. */
  .card.fora { border-style: dashed; }
  .mover {
    display: flex; gap: 5px; margin-top: 9px; padding-top: 9px;
    border-top: 1px dashed var(--border-default);
  }
  .mover button {
    flex: 1; padding: 4px 6px; font-size: 11px; font-weight: 500;
    border-radius: 6px; color: var(--text-muted);
  }
  .mover button[aria-pressed="true"] {
    background: var(--bg-surface-3); color: var(--text-primary); font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <button id="voltar" class="icone" title="Voltar para meus murais">←</button>
  <span class="marca"><span class="ponto-marca"></span><h1 id="titulo">Mural</h1></span>
  <span class="sync-info" id="info">carregando…</span>
  <span class="espaco"></span>
  <button id="tema" class="icone" title="Alternar tema">◐</button>
  <button id="visto" title="Zera as marcas NOVO e MUDOU">Marcar como visto</button>
  <button id="atualizar" class="primario">Atualizar</button>
</header>

<div class="barra-sync" id="barra" hidden>
  <div class="trilho"><div class="pulso" id="pulso"></div></div>
  <span id="status-sync">iniciando…</span>
</div>

<p class="erro" id="erro" hidden></p>

<main>
  <section class="coluna">
    <header>
      <span class="selo"><span class="ponto" style="background:var(--marca-aberto)"></span><span id="rot-aberto">Sem reação</span></span>
      <span class="contagem" id="c-aberto">0</span>
    </header>
    <div class="lista" id="col-aberto"></div>
  </section>
  <section class="coluna">
    <header>
      <span class="selo"><span class="ponto" style="background:var(--marca-interagido)"></span>Interagido</span>
      <span class="contagem" id="c-interagido">0</span>
    </header>
    <div class="lista" id="col-interagido"></div>
  </section>
  <section class="coluna">
    <header>
      <span class="selo"><span class="ponto" style="background:var(--marca-feito)"></span>Concluído</span>
      <span class="contagem" id="c-feito">0</span>
    </header>
    <div class="lista" id="col-feito"></div>
  </section>
</main>

<script>
// O id do mural vem da URL (/m/<id>) — cada quadro tem historico proprio, entao
// tudo daqui pra frente e por mural, inclusive a marca de "ja vi".
const MURAL_ID = location.pathname.split('/').pop();
const CHAVE_VISTO = 'mural:ultima-visita:' + MURAL_ID;
const CHAVE_TEMA = 'mural:tema';

let ultimaVisita = localStorage.getItem(CHAVE_VISTO) || null;
let cache = [];
let muralAtual = null;

const $ = (id) => document.getElementById(id);

$('voltar').addEventListener('click', () => { location.href = '/'; });

// ---- tema (data-color-mode, igual ao apps/status: o modo resolvido manda,
// nao o OS — mas o OS define o padrao na primeira visita) ----
function aplicarTema(modo) {
  document.documentElement.setAttribute('data-color-mode', modo);
  localStorage.setItem(CHAVE_TEMA, modo);
}
aplicarTema(
  localStorage.getItem(CHAVE_TEMA) ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
);
$('tema').addEventListener('click', () => {
  aplicarTema(document.documentElement.getAttribute('data-color-mode') === 'dark' ? 'light' : 'dark');
});

// ---- helpers ----
function dataCurta(iso) {
  const d = new Date(iso);
  if (d.toDateString() === new Date().toDateString()) return 'hoje ' + d.toTimeString().slice(0, 5);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

function diasParados(iso) {
  return Math.floor((Date.now() - new Date(iso)) / 86400000);
}

function badge(classe, texto) {
  const s = document.createElement('span');
  s.className = 'badge ' + classe;
  s.textContent = texto;
  return s;
}

function linkDesktop(webUrl) {
  if (!webUrl) return '#';
  return webUrl.replace(/^https:\/\/teams\.microsoft\.com\//, 'msteams://teams.microsoft.com/');
}

// ---- card ----
function montarCard(t) {
  const a = document.createElement('a');
  a.className = 'card';
  // O href fica para o hover mostrar o destino e permitir "copiar link", mas quem
  // abre de fato e o servidor: o navegador ignora msteams:// em silencio.
  a.href = linkDesktop(t.webUrl);
  if (t.foraDeAlcance) a.classList.add('fora');
  a.addEventListener('click', async (ev) => {
    ev.preventDefault();
    try {
      const r = await fetch(
        `/api/abrir?mural=${MURAL_ID}&id=${encodeURIComponent(t.id)}`, { method: 'POST' }
      );
      const d = await r.json();
      if (!d.ok) throw new Error(d.erro);
      mostrarErro(null);
    } catch (e) {
      mostrarErro('Não consegui abrir o Teams: ' + e.message + ' — use o atalho "web" no card.');
    }
  });

  const texto = document.createElement('div');
  texto.className = 'texto';
  texto.textContent = t.summary;
  a.appendChild(texto);

  const rodape = document.createElement('div');
  rodape.className = 'rodape';

  const ehNovo = ultimaVisita && t.firstSeen > ultimaVisita;
  const mudou = ultimaVisita && t.statusChangedAt > ultimaVisita && !ehNovo;

  if (ehNovo) rodape.appendChild(badge('info', 'novo'));
  if (mudou) rodape.appendChild(badge('warning', 'mudou'));
  if (t.kind === 'bug') rodape.appendChild(badge('danger', 'bug'));
  if (t.foraDeAlcance) {
    const b = badge('neutral', 'fora de alcance');
    b.title = 'Saiu das mensagens que a API devolve. O Teams não atualiza mais ' +
              'este card — mova à mão se o status mudar por lá.';
    rodape.appendChild(b);
  }
  if (t.movidoAMao) rodape.appendChild(badge('neutral', 'movido à mão'));
  // Sem emoji fixo para "peguei", ver a reacao usada e a unica forma de saber
  // o que aconteceu na mensagem.
  for (const e of (t.emojis || [])) rodape.appendChild(badge('reacao', e));

  const autor = document.createElement('span');
  autor.className = 'autor';
  const dias = diasParados(t.createdDateTime);
  const parado = (t.status === 'aberto' && dias >= 3) ? ` · parada há ${dias}d` : '';
  autor.textContent = `${t.author} · ${dataCurta(t.createdDateTime)}${parado}`;
  rodape.appendChild(autor);

  if (t.webUrl) {
    const web = document.createElement('span');
    web.className = 'abrir-web';
    web.textContent = 'web';
    web.title = 'Abrir no Teams do navegador';
    web.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      window.open(t.webUrl, '_blank', 'noopener');
    });
    rodape.appendChild(web);
  }

  a.appendChild(rodape);

  // Mover a mao so existe para card fora de alcance. Enquanto a mensagem ainda
  // aparece no Teams, quem manda e a reacao de la — mover aqui criaria um quadro
  // que mente ate a proxima atualizacao desfazer.
  if (t.foraDeAlcance) a.appendChild(montarControlesDeMover(t));

  return a;
}

function montarControlesDeMover(t) {
  const barra = document.createElement('div');
  barra.className = 'mover';
  for (const [status, rotulo] of [
    ['aberto', rotuloDaPrimeiraColuna()],
    ['interagido', 'Interagido'],
    ['feito', 'Concluído'],
  ]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = rotulo;
    b.setAttribute('aria-pressed', String(t.status === status));
    b.addEventListener('click', async (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (t.status === status) return;
      try {
        const r = await fetch('/api/mover?mural=' + MURAL_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: t.id, status }),
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.erro);
        mostrarErro(null);
        desenhar(d.tasks);
      } catch (e) {
        mostrarErro(e.message);
      }
    });
    barra.appendChild(b);
  }
  return barra;
}

// ---- render ----
const COLUNAS = ['aberto', 'interagido', 'feito'];

// "Ninguem pegou" pressupoe um time dividindo trabalho — numa conversa de duas
// pessoas isso nao quer dizer nada.
function rotuloDaPrimeiraColuna() {
  if (muralAtual && muralAtual.tipo === 'chat' && muralAtual.subtipo === 'oneOnOne') {
    return 'Sem reação';
  }
  return 'Ninguém pegou';
}

function desenhar(tasks) {
  cache = tasks;
  const grupos = { aberto: [], interagido: [], feito: [] };
  for (const t of tasks) (grupos[t.status] || grupos.aberto).push(t);

  // Abertas: mais antigas primeiro — o que está parado há mais tempo sobe.
  grupos.aberto.sort((a, b) => a.createdDateTime.localeCompare(b.createdDateTime));
  for (const k of ['interagido', 'feito']) {
    grupos[k].sort((a, b) => b.statusChangedAt.localeCompare(a.statusChangedAt));
  }

  for (const status of COLUNAS) {
    const lista = grupos[status];
    const alvo = $('col-' + status);
    alvo.replaceChildren();
    if (!lista.length) {
      const v = document.createElement('div');
      v.className = 'vazio';
      v.textContent = 'nada aqui';
      alvo.appendChild(v);
    } else {
      for (const t of lista) alvo.appendChild(montarCard(t));
    }
    $('c-' + status).textContent = lista.length;
  }
}

function mostrarErro(msg) {
  const e = $('erro');
  if (!msg) { e.hidden = true; return; }
  e.hidden = false;
  e.textContent = msg;
}

function atualizarInfo(lastSync) {
  $('info').textContent = lastSync
    ? 'última leitura: ' + new Date(lastSync).toLocaleString('pt-BR')
    : 'nunca sincronizado — clique em Atualizar';
}

async function carregar() {
  const [tarefas, info] = await Promise.all([
    fetch('/api/tasks?mural=' + MURAL_ID).then((r) => r.json()),
    fetch('/api/mural?id=' + MURAL_ID).then((r) => r.json()),
  ]);

  if (!info.ok) {
    mostrarErro('Este mural não existe mais. Voltando para a lista…');
    setTimeout(() => (location.href = '/'), 1500);
    return;
  }

  muralAtual = info.mural;
  $('titulo').textContent = muralAtual.nome;
  document.title = muralAtual.nome + ' · Mural';
  $('rot-aberto').textContent = rotuloDaPrimeiraColuna();

  atualizarInfo(tarefas.lastSync);
  desenhar(tarefas.tasks);
}

// ---- sync com progresso ----
let timerProgresso = null;

function mmss(s) {
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

async function tickProgresso() {
  try {
    const d = await (await fetch('/api/status')).json();
    const p = d.progresso;
    if (!p) return;
    const pulso = $('pulso');
    // So mostra proporcao depois que a leitura comeca de fato; antes disso nao
    // ha nada honesto para medir.
    if (p.lidas > 0) {
      pulso.classList.remove('indefinido');
      pulso.style.width = Math.min(98, (p.lidas / p.total) * 100) + '%';
      $('status-sync').textContent = `${p.etapa} — ${p.lidas} de ~${p.total}  ·  ${mmss(p.segundos)}`;
    } else {
      pulso.classList.add('indefinido');
      $('status-sync').textContent = `${p.etapa}  ·  ${mmss(p.segundos)}`;
    }
  } catch { /* servidor fora: o fetch principal mostra o erro */ }
}

$('atualizar').addEventListener('click', async () => {
  const btn = $('atualizar');
  btn.disabled = true;
  btn.textContent = 'Lendo o Teams…';
  mostrarErro(null);

  $('barra').hidden = false;
  $('pulso').classList.add('indefinido');
  $('pulso').style.width = '';
  $('status-sync').textContent = 'iniciando o Claude…';
  timerProgresso = setInterval(tickProgresso, 1000);

  try {
    const d = await (await fetch('/api/sync?mural=' + MURAL_ID, { method: 'POST' })).json();
    if (!d.ok) throw new Error(d.erro);
    atualizarInfo(d.lastSync);
    desenhar(d.tasks);
    const partes = [];
    if (d.novos.length) partes.push(`${d.novos.length} nova(s)`);
    if (d.mudaram.length) partes.push(`${d.mudaram.length} mudou/mudaram de status`);
    // Uma task movida a mao que reapareceu no Teams volta a obedecer a reacao
    // real; avisar evita a impressao de que o quadro desfez a acao sozinho.
    if (d.retomadas && d.retomadas.length) {
      partes.push(`${d.retomadas.length} voltou ao Teams e teve o status corrigido`);
    }
    $('info').textContent += partes.length ? '  —  ' + partes.join(', ') : '  —  nada mudou';
  } catch (e) {
    mostrarErro('Falhou: ' + e.message);
  } finally {
    clearInterval(timerProgresso);
    $('barra').hidden = true;
    btn.disabled = false;
    btn.textContent = 'Atualizar';
  }
});

$('visto').addEventListener('click', () => {
  ultimaVisita = new Date().toISOString();
  localStorage.setItem(CHAVE_VISTO, ultimaVisita);
  desenhar(cache);
});

// Se voce recarregar a pagina no meio de um sync, o painel reencontra o processo
// em vez de fingir que nada esta acontecendo.
async function retomarSyncEmAndamento() {
  try {
    const d = await (await fetch('/api/status')).json();
    if (!d.syncing) return;
    const btn = $('atualizar');
    btn.disabled = true;
    btn.textContent = 'Lendo o Teams…';
    $('barra').hidden = false;
    timerProgresso = setInterval(async () => {
      await tickProgresso();
      const s = await (await fetch('/api/status')).json();
      if (!s.syncing) {
        clearInterval(timerProgresso);
        $('barra').hidden = true;
        btn.disabled = false;
        btn.textContent = 'Atualizar';
        carregar();
      }
    }, 1000);
  } catch {}
}

carregar()
  .then(retomarSyncEmAndamento)
  .catch((e) => mostrarErro('Não consegui carregar: ' + e.message));
</script>
